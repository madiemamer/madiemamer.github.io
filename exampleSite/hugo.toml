
author = "Madeline (Madie) Mamer"
copyright = "© 2026, Madeline Mamer"
languageCode = "en"
DefaultContentLanguage = "en"
enableInlineShortcodes = true
# prevent build failures when using Hugo's Instagram shortcode due to deprecated Instagram API.
# See https://github.com/gohugoio/hugo/issues/7228#issuecomment-714490456
ignoreErrors = ["error-remote-getjson"]
theme = "hugo-paper"
baseURL = "https://madiemamer.github.io/"
title = "Madeline (Madie) Mamer"
[pagination]
  pagerSize = 3

[params]
  color = 'linen'
  favicon = 'favicon.png'                  # browser tab icon
  appleTouchIcon = 'apple-touch-icon.png'  # icon when saved to a phone home screen
  avatar = 'https://madiemamer.github.io/IMG_7821.jpeg'
  name = 'Madeline'
  bio = 'Your one-liner here'
# ------------------------------

# needed to  render raw HTML (e.g. <sub>, <sup>, <kbd>, <mark>)
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
#  [markup.highlight]
#    lineNos = true

[menu]

  [[menu.main]]
    name = "Research"
    url = "/#research"
    weight = 1
  [[menu.main]]
    name = "Presentations"
    url = "/presentations/"
    weight = 2
  [[menu.main]]
    name = "Teaching"
    url = "/teaching/"
    weight = 3
  [[menu.main]]
    name = "Mentorship"
    url = "/mentorship/"
    weight = 4
  [[menu.main]]
    name = "Illustration"
    url = "/illustration/"
    weight = 5
  [[menu.main]]
    name = "CV"
    url = "/mamer-cv.pdf"
    weight = 6

[taxonomies]
category = "categories"
tag = "tags"
series = "series"

[privacy]

  [privacy.vimeo]
    disabled = false
    simple = true

  [privacy.x]
    disabled = false
    enableDNT = true
    simple = true

  [privacy.instagram]
    disabled = false
    simple = true

  [privacy.youtube]
    disabled = false
    privacyEnhanced = true

[services]

  [services.instagram]
    disableInlineCSS = true

  [services.x]
    disableInlineCSS = true
