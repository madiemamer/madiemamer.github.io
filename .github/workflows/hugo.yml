name: Deploy Hugo site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.9'
          extended: true
      - id: pages
        uses: actions/configure-pages@v5
      - name: Put theme in place
        run: |
          mkdir -p exampleSite/themes/hugo-paper
          cp -r layouts assets static i18n theme.toml exampleSite/themes/hugo-paper/
      - name: Build site
        run: >
          hugo --gc --minify
          --source exampleSite
          --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: exampleSite/public
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
